<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- The rope biting. The reference has no sprite for this — it blooms the lamp
       — so this is that bloom, in the rope's own cyan, as a one-shot burst. -->
  <defs>
    <radialGradient id="bite" cx="20" cy="20" r="20" gradientUnits="userSpaceOnUse">
      <stop data-token="rope" offset="0" stop-color="#a8ecff" stop-opacity="0.9" />
      <stop data-token="rope" offset="0.45" stop-color="#a8ecff" stop-opacity="0.3" />
      <stop data-token="rope" offset="1" stop-color="#a8ecff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle data-token="rope" fill="url(#bite)" cx="20" cy="20" r="20" />
  <circle data-token="rope" fill="none" stroke="#a8ecff" stroke-opacity="0.75" stroke-width="1.6" cx="20" cy="20" r="12" />
  <circle data-token="anchorHot" fill="#ffffff" fill-opacity="0.9" cx="20" cy="20" r="3.5" />
</svg>
