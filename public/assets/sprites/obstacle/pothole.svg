<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 10">
  <!-- A pothole has no height at all in the reference — it is footprint and
       nothing else, which is precisely what makes it the hardest hazard to see
       coming. A thin lit rim is all that separates it from the road. -->
  <path data-token="hazardDark" fill="#5e1a12" fill-opacity="0.85" d="M4,5 L11,1 L28,0.6 L37,4 L35,8.6 L14,9.6 L5,8 Z" />
  <path data-token="hazard" fill="none" stroke="#ff4a35" stroke-opacity="0.5" stroke-width="1" d="M4,5 L11,1 L28,0.6 L37,4 L35,8.6 L14,9.6 L5,8 Z" />
</svg>
