<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 36">
  <!-- A stalled vehicle, drawn the way the reference draws every obstacle: a flat
       block in hazard red filling its lane, standing on the dark footprint it
       casts on the road. Its two rear lights are the only detail, and they are
       what tells you it is a car and not roadworks. -->
  <rect data-token="hazardDark" fill="#5e1a12" fill-opacity="0.55" x="0" y="30" width="40" height="6" />
  <rect data-token="hazard" fill="#ff4a35" x="0" y="0" width="40" height="30" />
  <rect data-token="rearLight" fill="#ff2f3a" x="2" y="7.5" width="5.4" height="4.8" />
  <rect data-token="rearLight" fill="#ff2f3a" x="32.6" y="7.5" width="5.4" height="4.8" />
</svg>
