    <radialGradient id="bloom" cx="20" cy="14.2" r="19" gradientUnits="userSpaceOnUse">
      <stop data-token="anchorActive" offset="0" stop-color="#7ef2ff" stop-opacity="0.55" />
      <stop data-token="anchorActive" offset="0.5" stop-color="#7ef2ff" stop-opacity="0.22" />
      <stop data-token="anchorActive" offset="1" stop-color="#7ef2ff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle data-token="anchorActive" fill="url(#bloom)" cx="20" cy="14.2" r="19" />
  <rect data-token="anchorActive" fill="#7ef2ff" x="16.6" y="17" width="6.8" height="103" />
