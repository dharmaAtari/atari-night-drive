<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 120">
  <!-- Attached: the lamp goes white-hot while the rope is on it. Bar and bloom
       stay the open cyan, so the change reads as heat, not as a different post. -->
  <defs>
    <radialGradient id="bloomHot" cx="20" cy="14.2" r="19" gradientUnits="userSpaceOnUse">
      <stop data-token="anchorHot" offset="0" stop-color="#ffffff" stop-opacity="0.7" />
      <stop data-token="anchorActive" offset="0.5" stop-color="#7ef2ff" stop-opacity="0.3" />
      <stop data-token="anchorActive" offset="1" stop-color="#7ef2ff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle data-token="anchorHot" fill="url(#bloomHot)" cx="20" cy="14.2" r="19" />
  <rect data-token="anchorActive" fill="#7ef2ff" x="16.6" y="17" width="6.8" height="103" />
  <rect data-token="anchorHot" fill="#ffffff" x="10.82" y="6.1" width="18.36" height="16.32" />
</svg>
