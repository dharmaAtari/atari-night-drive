<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 120">
  <!-- The high-beam pickup. Identical to the power pickup but violet, which is
       the reference's only separation between the two — they are read by colour,
       never by shape, so neither can be mistaken for a plain anchor. -->
  <defs>
    <radialGradient id="bloomBeam" cx="20" cy="14.2" r="19" gradientUnits="userSpaceOnUse">
      <stop data-token="pickupBeam" offset="0" stop-color="#c08cff" stop-opacity="0.55" />
      <stop data-token="pickupBeam" offset="0.5" stop-color="#c08cff" stop-opacity="0.22" />
      <stop data-token="pickupBeam" offset="1" stop-color="#c08cff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle data-token="pickupBeam" fill="url(#bloomBeam)" cx="20" cy="14.2" r="19" />
  <rect data-token="pickupBeam" fill="#c08cff" x="16.6" y="17" width="6.8" height="103" />
  <rect data-token="pickupBeam" fill="#c08cff" x="10.82" y="6.1" width="18.36" height="16.32" />
  <circle data-token="pickupBeam" fill="none" stroke="#c08cff" stroke-opacity="0.9" stroke-width="3.4" cx="20" cy="63.4" r="15" />
</svg>
