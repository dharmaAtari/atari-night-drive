<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 80">
  <!-- The unlit roadside post — barrier grey with a warm reflector cap, at the
       reference's proportions (0.022 wide by 0.34 tall in road half-widths). An
       anchor is one of these, lit: same silhouette, different colour, which is
       the whole reason a lit one is legible without a tutorial. -->
  <rect data-token="barrier" fill="#4a5266" x="3.4" y="0" width="5.2" height="80" />
  <rect data-token="edgeWarn" fill="#ffbe78" fill-opacity="0.5" x="3.4" y="0" width="5.2" height="11.2" />
</svg>
